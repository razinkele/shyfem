# SHYFEM UI - Conda/Micromamba environment definition
# This is the single source of truth for the runtime environment.
# Install: micromamba create -f environment.yml
# Update:  micromamba update -f environment.yml
name: shiny
channels:
  - conda-forge

dependencies:
  # Python runtime
  - python=3.12

  # --- Core application ---
  - pip

  # Scientific stack (use conda-forge for binary packages)
  - numpy>=1.24
  - scipy>=1.12
  - pandas>=2.0
  - xarray>=2024.6
  - netcdf4>=1.6
  - matplotlib>=3.7
  - pyproj
  - fiona
  - shapely
  - rasterio
  
  # Server and Database
  - celery
  - redis-py
  - psycopg2
  - alembic

  # Install remaining packages via pip (pure-Python or PyPI-only)
  - pip:
      # Pinned to the minor the laguna worker actually runs (conda env: shiny
      # 1.8.0 as of 2026-09-16) so CI exercises prod's version. History: 1.6.x
      # fixed the priority:'event' setInputValue reset the E2E active-project
      # tests rely on; 1.7 renamed @render.download -> @render.download_button
      # (pages/mesh_builder.py shims both). Keep the <next-minor cap so a new
      # shiny can't silently float CI to an untested version (how 1.6.3 first
      # broke E2E); bump it deliberately when the worker env moves, after
      # running the suite with PYTHONNOUSERSITE=1 against that env.
      - shiny>=1.8,<1.9
      - shinyswatch>=0.7.0
      - shinywidgets>=0.3
      - shiny-deckgl @ git+https://github.com/razinkele/shiny_deckgl.git
      - sqlalchemy>=2.0
      - pydantic>=2.0
      - pydantic-settings>=2.0
      - plotly>=5.24
      - ipyleaflet>=0.18
      - triangle>=20220202
      - aiofiles>=23.0
      - argon2-cffi>=21.0

      # Dev / testing
      - pytest>=7.0
      - pytest-asyncio>=0.21
      - pytest-cov>=4.0
      - playwright>=1.50
      - pytest-playwright>=0.4
      - pytest-base-url>=2.0
      - black>=23.0
      - ruff>=0.1.0

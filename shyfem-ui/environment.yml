# SHYFEM UI - Conda/Micromamba environment definition
# This is the single source of truth for the runtime environment.
# Install: micromamba create -f environment.yml
# Update:  micromamba update -f environment.yml
name: shiny
channels:
  - conda-forge

dependencies:
  # Python runtime
  - python=3.12

  # --- Core application ---
  - pip

  # Scientific stack (use conda-forge for binary packages)
  - numpy>=1.24
  - scipy>=1.12
  - pandas>=2.0
  - xarray>=2024.6
  - netcdf4>=1.6
  - matplotlib>=3.7
  - pyproj
  - fiona
  - shapely
  - rasterio
  
  # Server and Database
  - celery
  - redis-py
  - psycopg2
  - alembic

  # Install remaining packages via pip (pure-Python or PyPI-only)
  - pip:
      # Pin to <1.6: shiny 1.6.x changed reactive/setInputValue timing such that
      # the E2E active-project propagation tests fail (reproduced locally — the
      # full suite passes 190/190 on 1.5.1 but 4 workflow tests fail on 1.6.3).
      # Unpinned (>=1.2.0) silently floated CI to 1.6.3 -> red E2E. Revisit as a
      # deliberate shiny upgrade with accompanying test fixes.
      - shiny>=1.5,<1.6
      - shinyswatch>=0.7.0
      - shinywidgets>=0.3
      - shiny-deckgl @ git+https://github.com/razinkele/shiny_deckgl.git
      - sqlalchemy>=2.0
      - pydantic>=2.0
      - pydantic-settings>=2.0
      - plotly>=5.24
      - ipyleaflet>=0.18
      - triangle>=20220202
      - aiofiles>=23.0
      - argon2-cffi>=21.0

      # Dev / testing
      - pytest>=7.0
      - pytest-asyncio>=0.21
      - pytest-cov>=4.0
      - playwright>=1.50
      - pytest-playwright>=0.4
      - pytest-base-url>=2.0
      - black>=23.0
      - ruff>=0.1.0

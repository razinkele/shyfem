[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shyfem-ui"
# Versioned independently of SHYFEM (the Fortran core); not bumped by
# bin/bump-version.sh.
version = "0.7.2"
description = "Python Shiny web interface for SHYFEM hydrodynamic simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [
    {name = "SHYFEM Team"}
]
keywords = ["shyfem", "hydrodynamic", "simulation", "shiny", "web-ui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
]

dependencies = [
    "shiny>=1.2.0",
    "shinyswatch>=0.7.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "matplotlib>=3.7",
    "plotly>=5.24",
    "xarray>=2024.6",
    "netCDF4>=1.6",
    "aiofiles>=23.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=15",
    "ipyleaflet>=0.18",
    "shinywidgets>=0.3",
    "scipy>=1.12",
    "shapely>=2.0",
    "triangle>=20220202",
    "argon2-cffi>=21.0",
    "alembic>=1.18,<2",
    # Pinned to the git tag the shiny env is installed from (the tested
    # version). PyPI's "shiny-deckgl" is the same author's package, but only
    # 1.12.0 is published there. Direct references block a PyPI upload of
    # shyfem-ui, which is not published there.
    "shiny-deckgl @ git+https://github.com/razinkele/shiny_deckgl.git@v1.9.2",
]

[project.optional-dependencies]
server = [
    "celery>=5.3",
    "redis>=4.5",
    "psycopg2-binary>=2.9",
    "gunicorn>=21.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-rerunfailures>=14.0",
    "black>=23.0",
    "ruff>=0.1.0",
    # starlette.testclient (tests/test_downloads.py) needs an HTTP client:
    # current starlette imports httpx2, and plain httpx only as a deprecated
    # fallback. Nothing else we install brings either one, so without this
    # line CI's unit job stops while collecting the tests.
    "httpx2>=2.0",
]

[project.scripts]
shyfem-ui = "shyfem_ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shyfem_ui*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--ignore-glob=tests/test_playwright_*.py -p no:zarr"
# datetime.utcnow() is deprecated (3.12) and was silently in use for retention
# cutoffs; any call in a tested path now fails. Use shyfem_ui.timeutil.utcnow().
filterwarnings = ["error:datetime.datetime.utcnow:DeprecationWarning"]
markers = [
    "e2e: end-to-end browser tests (require Playwright + live server)",
    "slow: tests that take more than 5 seconds",
]

[tool.coverage.run]
source = ["shyfem_ui"]
omit = ["shyfem_ui/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

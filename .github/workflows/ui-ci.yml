name: SHYFEM UI CI

on:
  push:
    branches: [main]
    paths:
      - "shyfem-ui/**"
      - ".github/workflows/ui-ci.yml"
      # docs-only changes (markdown anywhere) don't affect the build — skip CI.
      # Order matters: this exclusion must come after the includes (last match wins).
      - "!**/*.md"
  pull_request:
    paths:
      - "shyfem-ui/**"
      - ".github/workflows/ui-ci.yml"
      - "!**/*.md"

defaults:
  run:
    working-directory: shyfem-ui

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: shyfem-ui/environment.yml
          cache-environment: true
          init-shell: bash
      - name: Ruff check
        shell: micromamba-shell {0}
        run: python -m ruff check shyfem_ui/
      - name: Black check
        shell: micromamba-shell {0}
        run: python -m black --check shyfem_ui/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: shyfem-ui/environment.yml
          cache-environment: true
          init-shell: bash
      - name: Install package
        shell: micromamba-shell {0}
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        shell: micromamba-shell {0}
        run: |
          python -m pytest tests/ -v \
            --ignore-glob="tests/test_playwright_*.py" \
            --cov=shyfem_ui --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=50
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: shyfem-ui/coverage.xml

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: shyfem-ui/environment.yml
          cache-environment: true
          init-shell: bash
      - name: Install package
        shell: micromamba-shell {0}
        run: pip install -e ".[dev]"
      - name: Install Playwright browsers
        shell: micromamba-shell {0}
        run: python -m playwright install chromium --with-deps
      - name: Run E2E tests
        shell: micromamba-shell {0}
        # Suite passes 190/190 locally with no reruns; run it straight here
        # too so a genuine flake fails the job instead of being masked by
        # a retry.
        run: python -m pytest tests/test_playwright_*.py -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image (all stages)
        run: docker build -t shyfem-ui-test .

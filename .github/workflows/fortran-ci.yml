name: Fortran CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Rules.make'
      - 'Makefile'
      - 'testcases/**'
      - 'bin/**'
      - '.github/workflows/fortran-ci.yml'
      # docs-only changes (markdown anywhere) don't affect the build — skip CI.
      # Order matters: this exclusion must come after the includes (last match wins).
      - '!**/*.md'
  pull_request:
    paths:
      - 'src/**'
      - 'Rules.make'
      - 'Makefile'
      - 'testcases/**'
      - 'bin/**'
      - '.github/workflows/fortran-ci.yml'
      - '!**/*.md'

jobs:
  # SHYFEM is fundamentally an MPI-NODE codebase (no maintained serial path:
  # lagrange_mpi.f90 calls MPI collectives directly). This job builds the real
  # NODE binary and runs mar_menor single-process, which is what "serial" means
  # in practice.
  serial-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran openmpi-bin libopenmpi-dev libmetis-dev \
            libnetcdf-dev libnetcdff-dev libx11-dev libxt-dev

      - name: Build (NODE) and capture warnings
        run: |
          set -o pipefail
          make fem PARTS=METIS METISDIR=/usr 2>&1 | tee build.log
          echo "=== Compiler warnings summary ==="
          grep -c 'Warning:' build.log || echo "0 warnings"
          echo ""
          echo "=== Warnings in src/shyfem/ and src/utils/ ==="
          grep 'Warning:' build.log | grep -E 'src/(shyfem|utils)/' | head -50 || echo "No warnings in core"

      - name: Run Mar Menor test
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          cd testcases/examples/mar_menor
          make init
          bash mm_hyd_00.sh

      # Feature battery: each STR exercises a subsystem the basic
      # mm_hyd_00 run never touches (beaching, OI assimilation,
      # restart write/read cycle). Success marker is a normal
      # "simulation end" in the output.
      - name: Run feature battery (beaching, assimilation, restart)
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          cd testcases/examples/mar_menor
          for t in mm_hyd_beach mm_hyd_assim mm_rst_cycle_write mm_rst_cycle_read; do
            echo "=== $t ==="
            shyfem $t.str > $t.out 2>&1 || { tail -40 $t.out; exit 1; }
            grep -q "simulation end" $t.out || { echo "$t: no simulation end"; tail -40 $t.out; exit 1; }
            echo "$t: OK"
          done

      # The venice smoke is the ONLY test covering the 3d baroclinic +
      # GOTM + wet/dry + heat-forcing path - the ssurface sentinel bug
      # (PR #58) blew this up for five months while every mar_menor
      # test stayed green.
      - name: Run Venice lagoon 3D smoke test
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          cd testcases/examples/venice_lagoon
          shypre -silent GRID/venlag62.grd
          shyfem venlag_smoke.str > venlag_smoke.out 2>&1 || { tail -40 venlag_smoke.out; exit 1; }
          grep -q "simulation end" venlag_smoke.out || { echo "no simulation end"; tail -40 venlag_smoke.out; exit 1; }
          echo "venlag_smoke: OK"
          # k-eps twin: iturb=2 never got past step 1 until PR #97
          shyfem venlag_keps_smoke.str > venlag_keps_smoke.out 2>&1 || { tail -40 venlag_keps_smoke.out; exit 1; }
          grep -q "simulation end" venlag_keps_smoke.out || { echo "no simulation end (keps)"; tail -40 venlag_keps_smoke.out; exit 1; }
          echo "venlag_keps_smoke: OK"

  fortran-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pure static analysis (no build needed) — fast gate against
      # implicit-none regressions. Warnings are captured in the build job.
      - name: Check for implicit none gaps (subroutine-scoped)
        run: |
          # src/shyfem and src/tools are clean — block any regression.
          ./bin/check_implicit_none.py src/shyfem --max-violations 0
          ./bin/check_implicit_none.py src/tools  --max-violations 0
          # src/utils is now clean (offenders cleaned to 0); block any regression.
          ./bin/check_implicit_none.py src/utils  --max-violations 0

  mpi-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran openmpi-bin libopenmpi-dev libmetis-dev \
            libnetcdf-dev libnetcdff-dev libx11-dev libxt-dev

      - name: MPI build
        run: make clean && make fem OMP=false MPI=true PARTS=METIS METISDIR=/usr

      - name: MPI run smoke
        # "Build compiles" != "build runs" (see CLAUDE.md's Intel-MPI trap):
        # an MPI binary can link cleanly and still crash inside MPI_Init or
        # deadlock on its first exchange. Actually run mar_menor at np=2
        # (partition.2.txt ships with the testcase) so a broken
        # src/utils/shympi change fails this job, not a user's laptop.
        run: |
          export PATH="/usr/bin:$GITHUB_WORKSPACE/bin:$PATH"
          cd testcases/examples/mar_menor
          make init
          mpirun --oversubscribe -np 2 shyfem mm_hyd_00.str
